name: Refresh pinned Next.js patches

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts next@16.3.8 eslint-config-next@16.3.8

      - name: Commit regenerated manifests
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency manifest changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(deps): update Next.js to 16.3.8"
          git push
