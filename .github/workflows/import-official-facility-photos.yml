name: Import Official Facility Photos

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-official-facility-photos.yml"
      - "scripts/import-official-facility-images.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Import official facility photos
        run: node scripts/import-official-facility-images.mjs

      - name: Commit imported photos
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/facilities/legacy src/data/facilities.ts
          git commit -m "Import official legacy facility photographs"
          git push
