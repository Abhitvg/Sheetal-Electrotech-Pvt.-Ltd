name: Scrape Official Sheetal Site

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/scrape-official-site.yml"
      - "scripts/scrape-legacy-site.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape-official-site
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Crawl official site and download assets
        run: node scripts/scrape-legacy-site.mjs

      - name: Commit extracted site archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legacy-site-extract
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
            exit 0
          fi
          git commit -m "chore: archive official Sheetal legacy site"
          git push
